url: https://ymbouamboua.github.io/DEGgo/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: DEGgo
  description: >
    Automated and reproducible bulk RNA-seq differential expression,
    Gene Ontology, and circadian rhythmicity analysis.

navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - news
    right:
      - github

  components:
    github:
      icon: fab fa-github
      aria-label: GitHub repository
      href: https://github.com/ymbouamboua/DEGgo

reference:
  - title: "Main workflow"
    desc: >
      Core functions for running differential expression analysis,
      functional enrichment, and report generation.
    contents:
      - run_deggo
      - run_go_enrichment
      - generate_deggo_report
      - generate_deggo_pptx

  - title: "Circadian rhythmicity analysis"
    desc: >
      Functions for preparing circadian transcriptomic datasets,
      detecting rhythmic genes, and running reproducible public examples.
    contents:
      - run_deggo_rhythmicity
      - deggo_extract_rhythmic_genes
      - prepare_circadian_tissue
      - download_gse98965
      - run_public_circadian_example

  - title: "Quality control"
    desc: >
      Functions for count-data exploration, sample-level quality control,
      filtering, and marker assessment.
    contents:
      - explore_bulk_rnaseq
      - check_raw_counts
      - run_sample_qc
      - remove_flagged_samples
      - marker_score_check

  - title: "Visualization"
    desc: >
      Functions for generating publication-ready differential expression
      and functional enrichment visualizations.
    contents:
      - plot_volcano
      - plot_heatmap
      - plot_pca
      - plot_go_terms
      - plot_all_go_terms
      - plot_gene_expression
      - plot_gene_heatmap

  - title: "Expression analysis"
    desc: >
      Functions for extracting and inspecting gene-expression values.
    contents:
      - extract_expression

  - title: "Gene and GO extraction"
    desc: >
      Functions for extracting differentially expressed genes,
      enriched Gene Ontology terms, and associated gene sets.
    contents:
      - deggo_extract_deg_genes
      - deggo_extract_go_genes
      - deggo_extract_go_genes_pairwise
      - deggo_extract_go_keywords

  - title: "Palettes and visualization helpers"
    desc: >
      Colour palettes and visual styling utilities used by DEGgo.
    contents:
      - deggo_palette

articles:
  - title: "Vignettes"
    navbar: "Vignettes"
    contents:
      - DEGgo
